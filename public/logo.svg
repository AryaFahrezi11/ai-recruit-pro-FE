<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Left Leg: Deep Navy to Royal Blue -->
    <linearGradient id="leftLeg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1E3F" />
      <stop offset="60%" stop-color="#163C7A" />
      <stop offset="100%" stop-color="#1E52A8" />
    </linearGradient>

    <!-- Right Leg: Electric Blue to Cyan -->
    <linearGradient id="rightLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Crossbar Ribbon: High-tech folded energy -->
    <linearGradient id="crossBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Neural Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <!-- Stylized Geometric "A" with folded ribbon architecture -->
  <g>
    <!-- Left Stalk (Dark Navy Structure) -->
    <path
      d="M 24 94 L 52 24 C 54 19 59 16 65 16 L 68 16 C 73 16 77 19 79 23 L 52 94 C 50 99 44 102 39 102 L 27 102 C 22 102 19 97 24 94 Z"
      fill="url(#leftLeg)"
    />

    <!-- Right Sweep (Vibrant Electric Blue) -->
    <path
      d="M 58 20 C 62 16 68 16 72 20 L 98 86 C 102 96 95 102 85 102 L 72 102 C 67 102 63 98 61 93 L 44 48 Z"
      fill="url(#rightLeg)"
    />

    <!-- Modern Dynamic Bridge / Crossbar -->
    <path
      d="M 38 68 L 84 68 C 88 68 91 71 89 75 L 87 79 C 85 83 81 85 77 85 L 31 85 C 27 85 24 82 26 78 L 28 74 C 30 70 34 68 38 68 Z"
      fill="url(#crossBar)"
    />

    <!-- AI Neural Core Sparkle (Top Right Node) -->
    <circle cx="88" cy="28" r="7" fill="url(#sparkGrad)" filter="url(#glow)" />
    <circle cx="88" cy="28" r="3.5" fill="#FFFFFF" />

    <!-- Subtle Connection Beam to Crossbar -->
    <circle cx="78" cy="76" r="3" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
